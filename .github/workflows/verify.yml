name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: |
          for part in runner backend frontend vectors; do
            if [ "$part" = "runner" ]; then
              mv project "quantumbench-$part"
            else
              git clone --depth 1 "https://github.com/quantumbench-labs/quantumbench-$part.git"
            fi
          done
          cd quantumbench-backend && npm ci && cd ..
      - run: node --test quantumbench-runner/test.mjs
